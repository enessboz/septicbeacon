name: Cloudflare AI Usage Check

on:
  push:
    paths:
      - ".github/workflows/cloudflare-ai-usage-check.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Query Cloudflare account usage
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          echo "== billable usage =="
          curl -sS -w "\nHTTP_STATUS:%{http_code}\n" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/billable/usage?from=2026-09-20&to=2026-09-20" \
            -H "Authorization: Bearer $CF_TOKEN"
          echo "== tiny Workers AI inference check =="
          curl -sS -w "\nHTTP_STATUS:%{http_code}\n" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/ai/run/@cf/meta/llama-3.2-1b-instruct" \
            -X POST \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"prompt":"Reply only with OK.","max_tokens":1}'
