name: Publish to SepticBeacon

on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: "Only test the WordPress connection"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "posts/*.json"
      - "publisher.py"
      - ".github/workflows/publish.yml"

permissions:
  contents: read

concurrency:
  group: septicbeacon-wordpress-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WP_SITE_URL: https://septicbeacon.com
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify WordPress connection
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_only }}
        run: python publisher.py --verify-only

      - name: Publish post jobs
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.verify_only) }}
        run: python publisher.py
